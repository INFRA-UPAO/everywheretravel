# Identificador del proyecto (debe coincidir con el Project key en SonarCloud)
sonar.projectKey=INFRA-UPAO_everywheretravel
sonar.projectName=everywheretravel
sonar.projectVersion=1.0
sonar.organization=infra-upao

# Codigo a analizar: aplicaciones (backend, frontend y lambda)
sonar.sources=apps/backend/src/main,apps/frontend/src,apps/lambda-doc-generator
# Excluye dependencias, artefactos de build, tests de Angular y archivos binarios
# (imagenes/plantillas en resources/static que el scanner no debe leer como texto)
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/*.spec.ts,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.svg,**/*.docx,**/*.pdf

# El analizador de Java requiere el bytecode compilado y las dependencias (jars)
# que el workflow genera con mvn compile + dependency:copy-dependencies
sonar.java.binaries=apps/backend/target/classes
sonar.java.libraries=apps/backend/target/dependency/*.jar

# Codificacion de los archivos
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
