---
- name: Deploy backend image to ECS
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../.."
    terraform_output_file: "{{ repo_root }}/ansible/terraform-output.json"
    outputs: "{{ lookup('file', terraform_output_file) | from_json }}"
    aws_region: "{{ outputs.aws_region.value }}"
    ecr_repo_url: "{{ outputs.ecr_repo_url.value }}"
    ecs_cluster_name: "{{ outputs.ecs_cluster_name.value }}"
    ecs_service_name: "{{ outputs.ecs_service_name.value }}"
    image_uri: "{{ ecr_repo_url }}:{{ image_tag }}"

  tasks:
    - name: Validate required image tag
      ansible.builtin.assert:
        that:
          - image_tag is defined
          - image_tag | length > 0
        fail_msg: "Run with -e image_tag=demo-v1"

    - name: Get current ECS service details
      community.aws.ecs_service_info:
        region: "{{ aws_region }}"
        cluster: "{{ ecs_cluster_name }}"
        service: "{{ ecs_service_name }}"
        details: true
      register: ecs_service_details

    - name: Read latest ECS task definition
      ansible.builtin.command: >
        aws ecs describe-task-definition
        --region {{ aws_region }}
        --task-definition {{ ecs_service_details.services[0].taskDefinition.split('/')[-1].split(':')[0] }}
        --output json
      register: current_task_definition_raw
      changed_when: false

    - name: Prepare new ECS task definition payload
      ansible.builtin.set_fact:
        current_task_definition: "{{ (current_task_definition_raw.stdout | from_json).taskDefinition }}"

    - name: Register new ECS task definition
      community.aws.ecs_taskdefinition:
        region: "{{ aws_region }}"
        family: "{{ current_task_definition.family }}"
        task_role_arn: "{{ current_task_definition.taskRoleArn }}"
        execution_role_arn: "{{ current_task_definition.executionRoleArn }}"
        network_mode: "{{ current_task_definition.networkMode }}"
        launch_type: "{{ current_task_definition.requiresCompatibilities[0] }}"
        cpu: "{{ current_task_definition.cpu }}"
        memory: "{{ current_task_definition.memory }}"
        containers: "{{ current_task_definition.containerDefinitions | map('combine', {'image': image_uri}) | list }}"
        volumes: "{{ current_task_definition.volumes }}"
        state: present

    - name: Update ECS service
      community.aws.ecs_service:
        region: "{{ aws_region }}"
        cluster: "{{ ecs_cluster_name }}"
        name: "{{ ecs_service_name }}"
        task_definition: "{{ current_task_definition.family }}"
        force_new_deployment: true
        state: present

    - name: Wait until ECS service is stable
      ansible.builtin.command: >
        aws ecs wait services-stable
        --region {{ aws_region }}
        --cluster {{ ecs_cluster_name }}
        --services {{ ecs_service_name }}
      changed_when: false

    - name: Show deployed image
      ansible.builtin.debug:
        msg: "Backend desplegado en ECS con imagen {{ image_uri }}"
